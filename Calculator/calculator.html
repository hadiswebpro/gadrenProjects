<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">    
    <link href="https://e-cdn-files.dzcdn.net/cache/images/common/favicon/favicon.5e8e3be4042b873a7358.ico" rel="shortcut icon" type="image/x-icon">
    <title>calculator</title>


<style>
    *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    position: relative;
    padding:20px;
    background:
    linear-gradient(135deg, #FFE3C4, #FFC078, #FFB352);
    transition:.4s;
    
}
.app{

    display:flex;
    justify-content:center;
    align-items:flex-start;
    gap:30;
    position: relative;

}

.calculator{
    width:90vw;
    max-width:430px;
    background:#FFF1E5;
    padding:25px;
    border-radius:30px;
    box-shadow:
    20px 20px 40px rgba(180,90,20,.25),
    -10px -10px 25px rgba(255,255,255,.8);

    transition:.4s;
}

.top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

h1{
    color:#D86600;
    font-size:38px;
}

.actions{
    display:flex;
    gap:10px;
}

.icon-btn{
    width:45px;
    height:45px;
    border:none;
    border-radius:50%;
    cursor:pointer;
    font-size:22px;
    background:#FFD09B;
    color:#A54D00;
    box-shadow:
    0 6px 0 #E9A85B,
    0 10px 20px rgba(0,0,0,.15);

    transition:.2s;

}

.icon-btn:hover{
    transform:
    translateY(-4px)
    rotate(10deg);
}

.icon-btn:active{

    transform:
    translateY(3px)
    scale(.95);
}

.display{

    height:90px;
    background:#FFF9F3;
    border-radius:20px;
    display:flex;
    justify-content:flex-end;
    align-items:center;
    padding:20px;
    margin-bottom:25px;
    font-size:40px;
    color:#9A4500;
    overflow-x :auto;
    white-space: nowrap;
    font-size: clamp(24px, 6vw, 40px);

    box-shadow:
    inset 5px 5px 12px rgba(180,100,30,.15),
    inset -5px -5px 12px white}

.buttons{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;

}

button{

    height:65px;
    border:none;
    border-radius:20px;
    cursor:pointer;
    font-size:23px;
    font-weight:bold;
    color:#8A4300;
    background:#FFDDBB;
    position:relative;
    overflow:hidden;

    box-shadow:
    0 8px 0 #EFB276,
    0 15px 25px rgba(0,0,0,.15);

    transition:.18s;

}

button:hover{

    transform:
    translateY(-5px)
    scale(1.05);
    background:#FFE8D2;

    box-shadow:
    0 14px 0 #EFB276,
    0 25px 35px rgba(0,0,0,.2);
}

button:active{
    transform:
    translateY(5px)
    scale(.96);

    box-shadow:
    0 3px 0 #EFB276,
    0 6px 10px rgba(0,0,0,.15);
}

.operator{
    background:#FFBD75;
    color:white;
}

.operator:hover{
    background:#FFA94D;
}

.equal{
    background:#FF7A00;
    color:white;
}

.equal:hover{
    background:#FF6500;
    box-shadow:
    0 0 20px #FF8C2B,
    0 14px 0 #D85C00;
}

.clear{
    background:#FFB6A0;
    color:white;
}

.delete{
    background:#E98A65;
    color:white;
}

.zero{
    grid-column:span 2;
}

.ripple{
    position:absolute;
    border-radius:50%;
    background: rgba(255,255,255,.6);
    transform:scale(0);
    animation:ripple .6s linear;
}

@keyframes ripple{

    to{
        transform:scale(4);
        opacity:0;
    }
}

.history{

    position:absolute;
    left:calc(100% + 30px);
    top:50%;
    transform:translateY(-50%);
    width:260px;
    margin-top:91px;
    padding:25px;
    border-radius:20px;
    background:#FFF8F0;
    color:#9A4500;
    box-shadow:
    inset 5px 5px 12px rgba(180,100,30,.12),
    inset -5px -5px 12px white;

    max-height:180px;
    overflow-y:auto;
}

.history h2{
    font-size:22px;
    margin-bottom:10px;
}

#historyList div{
    padding:8px 0;
    border-bottom:1px solid rgba(200,120,50,.2);
    font-size:17px;
}



/* =========================
        DARK MODE
========================= */
body.dark{
    background: linear-gradient(135deg, #21150F, #352015, #4A2B18);
}

body.dark .calculator{
    background:#3A271C;
    box-shadow:
    20px 20px 40px rgba(0,0,0,.4),
    -10px -10px 20px rgba(255,180,100,.05);
}

body.dark h1{
    color:#FFD19A;
}

body.dark .icon-btn{
    background:#68452D;
    color:#FFD7A8;
    box-shadow:
    0 6px 0 #4A2D1C;
}

body.dark .display{
    background:#241813;
    color:#FFD7A8;
}

body.dark button{
    background:#65432C;
    color:#FFE5CC;
    box-shadow:
    0 8px 0 #43291A,
    0 15px 25px rgba(0,0,0,.3);
}

body.dark button:hover{
    background:#805435;
}

body.dark .operator{
    background:#A65D20;
}

body.dark .equal{
    background:#FF8A24;
}

body.dark .history{
    background:#241813;
    color:#FFD7A8;
}

/* =========================
        DISPLAY ANIMATION
========================= */
.display.animate{
    animation:
    pop .18s ease;
}

@keyframes pop{
    0%{
        transform:scale(1);
    }
    50%{
        transform:scale(1.08);
    }
    100%{
        transform:scale(1);
    }
}




/* =========================
        RESPONSIVE
========================= */
@media(max-width:768px){

    h1{
        font-size:32px;
    }

    .display{
        height:80px;
        font-size:34px;
    }

    button{
        height:60px;
        font-size:21px;
    }

     .app{
        display:flex;
        flex-direction:column;
        align-items:center;
    }

    .history{

        position:static;
        transform:none;
        width:90vw;
        margin-top:91px;

    }

}

@media(max-width:480px){

    body{
        padding:12px;
    }

    h1{
        font-size:27px;
    }

    .icon-btn{
        width:38px;
        height:38px;
        font-size:18px;
    }

    .buttons{
        gap:10px;
    }

    button{
        height:55px;
        font-size:18px;
        border-radius:15px;
    }

    .display{
        height:70px;
        font-size:28px;
    }

       .app{
        display:flex;
        flex-direction:column;
        align-items:center;
    }

    .history{
        position:static;
        transform:none;
        width:90vw;
        margin-top:91px;
    }

}

</style>

</head>


<body>
  <div class="app">
    <main class="calculator">

        <div class="top-bar">
            <h1>Calculator</h1>
            <div class="actions">
                <button class="icon-btn" id="themeBtn">🌙</button>
                <button class="icon-btn" id="soundBtn">🔊</button>
            </div>
        </div>

        <div class="display" id="display">0</div>

        <div class="buttons">
            <button class="clear">AC</button>
            <button class="delete">⌫</button>
            <button class="operator">%</button>
            <button class="operator">/</button>
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="operator">*</button>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="operator">-</button>
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="operator">+</button>
            <button class="zero">0</button>
            <button class="dot">.</button>
            <button class="equal">=</button>
        </div>

    </main>

    <section class="history">
            <h2>History</h2>
            <div id="historyList"></div>
    </section>

  </div>   


</body>



<script>

const numberSound = new Audio("./sound/number.mp3");
const operatorSound = new Audio("./sound/operator.mp3");
const uiSound = new Audio("./sound/ui.mp3");
const errorSound = new Audio("./sound/error.mp3");
const equalSound = new Audio("./sound/equal.mp3");
const acSound = new Audio("./sound/ac.mp3");

const themeBtn = document.getElementById("themeBtn");
const soundBtn = document.getElementById("soundBtn");
const display = document.getElementById("display");
const body = document.body;
const operatorButtons =document.querySelectorAll(".operator");
const numbersBtn = document.querySelectorAll("button:not(.operator):not(.delete):not(.clear):not(.icon-btn):not(.equal):not(.dot)");
const clearBtn = document.querySelector(".clear");
const deleteBtn = document.querySelector(".delete");
const equalBtn = document.querySelector(".equal");
const dotBtn = document.querySelector(".dot");

let firstNumber = "";
let secondNumber = "";
let operator = "";
let displayValue = "";
let justCalculated = false;
let soundEnabled = true;


//load dark theme if it has set on dark

if(localStorage.getItem("theme") === "dark"){
    body.classList.add("dark");

}
if(localStorage.getItem("themeIcon") === "☀️"){
    themeBtn.textContent = "☀️";

}

themeBtn.addEventListener("click", function(){

    body.classList.toggle("dark");

    if(body.classList.contains("dark")){

        localStorage.setItem("theme", "dark");
        localStorage.setItem("themeIcon", "☀️")

    }else{

        localStorage.setItem("theme", "light");
        localStorage.setItem("themeIcon", "🌙")
    }

    themeBtn.textContent = body.classList.contains("dark") ? "☀️" : "🌙";
    playSound(uiSound);
})



//get operator

operatorButtons.forEach(function(btn){

    btn.addEventListener("click", function(){
        getOperator(btn.textContent);

    });

});

function getOperator(op){

    if(firstNumber === ""){
        return;
    }
   
    if(op === "%"){

        if(secondNumber === ""){
            firstNumber = String(Number(firstNumber) / 100);

        }else{
            secondNumber = String(
                Number(firstNumber) * Number(secondNumber) / 100
            );

        }

        display.textContent = firstNumber + operator + secondNumber;
        playSound(operatorSound)
        return;
    }

    if(secondNumber === ""){
        operator = op;

    }else{
        let result = calculate(
            Number(firstNumber),
            operator,
            Number(secondNumber)
        );

        firstNumber = String(result);
        secondNumber = "";
        operator = op;

    }

    justCalculated = false;
    display.textContent = firstNumber + operator;
    playSound(operatorSound);

}


//get numbers

numbersBtn.forEach(function(btn){

    btn.addEventListener("click", function(){
        getNumbers(btn.textContent);

    });
});

function getNumbers(num){
   
     if(justCalculated){

        firstNumber = "";
        secondNumber = "";
        operator = "";
        justCalculated = false;
    }

     if(operator === ""){
        firstNumber += num;

    }else{
        secondNumber += num;
    }

    display.textContent = firstNumber + operator + secondNumber;
    playSound(numberSound);

}


//calculate 

function calculate(num1, operator, num2) {

    let result;

    if (operator === "+") {
        result = num1 + num2;

    } else if (operator === "-") {
        result = num1 - num2;

    } else if (operator === "*") {
        result = num1 * num2;

    } else if (operator === "/" ) {

        if (num2 === 0) {
            return "ERROR_DIV_ZERO";
            
        }
        result = num1 / num2;
    }    

    if (result === undefined) {
        playSound(errorSound)
        return "Error";
        
    }

    return Number(result.toFixed(8));
}


equalBtn.addEventListener("click", function(){

    let result = calculate(Number(firstNumber), operator, Number(secondNumber));

    if(result === "ERROR_DIV_ZERO"){
        display.textContent = "Cannot divide by 0";
        playSound(errorSound);
        return;
    }

    firstNumber = String(result);
    secondNumber = "";
    operator = "";
    display.textContent = result;
    justCalculated = true;
    playSound(equalSound);

});



deleteBtn.addEventListener("click", function(){

    if(justCalculated){
        firstNumber = firstNumber.slice(0, -1);
        display.textContent = firstNumber || "0";
        return;
    }

    if(secondNumber !== ""){
        secondNumber = secondNumber.slice(0,-1);

    }else if(operator !== ""){
        operator = "";

    }else{
        firstNumber = firstNumber.slice(0,-1);

    }

    display.textContent = firstNumber + operator + secondNumber;
    playSound(operatorSound);
});



clearBtn.addEventListener("click", function(){
    firstNumber = "";
    operator = "";
    secondNumber = "";
    display.textContent = "0";
    justCalculated = false;
    playSound(acSound);

});


dotBtn.addEventListener("click", function(){

    if(justCalculated){
        firstNumber = "";
        secondNumber = "";
        operator = "";
        justCalculated = false;
    }

    if(operator === ""){

        if(!firstNumber.includes(".")){

            if(firstNumber === ""){
                firstNumber = "0.";
            }else{
                firstNumber += ".";
            }

        }

    }else{

        if(!secondNumber.includes(".")){

            if(secondNumber === ""){
                secondNumber = "0.";
            }else{
                secondNumber += ".";
            }

        }

    }

    display.textContent = firstNumber + operator + secondNumber;
    playSound(operatorSound);
});



//sound

soundBtn.addEventListener("click", function(){

    soundEnabled = !soundEnabled;

    if(soundEnabled){
        soundBtn.textContent = "🔊";
        playSound(uiSound);

    }else{
        soundBtn.textContent = "🔇";

    }

});


function playSound(sound){

    if(!soundEnabled){
        return;
    }

    sound.currentTime = 0;
    sound.play().catch(function(error){ console.log("Sound error:", error);});
}

</script>

</html>
